# Local Postgres + API.  Run:  docker compose up --build
# then in another terminal:     cd frontend && npm run dev   ->  http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cl
      POSTGRES_PASSWORD: cl
      POSTGRES_DB: channellens
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cl"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://cl:cl@db:5432/channellens
      # With no YOUTUBE_API_KEY in backend/.env, run on the fictional demo channels.
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
