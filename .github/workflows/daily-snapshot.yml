# Records one data point per watched channel per day, which is what builds the growth charts.
name: Daily snapshot
on:
  schedule:
    - cron: "30 0 * * *"   # 00:30 UTC = 06:00 IST
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger snapshot job
        env:
          API_URL: ${{ secrets.CHANNELLENS_API_URL }}
          CRON_SECRET: ${{ secrets.CHANNELLENS_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Snapshot secrets not set yet; skipping. Add CHANNELLENS_API_URL and CHANNELLENS_CRON_SECRET after deploying."
            exit 0
          fi
          curl --fail-with-body --retry 3 --retry-delay 30 --max-time 120 \
            -X POST "$API_URL/api/jobs/snapshot" -H "X-Cron-Secret: $CRON_SECRET"
