# Render Blueprint for the API (free instance, no card needed).
# The database is Neon's free Postgres (no card, no expiry): paste its connection string as DATABASE_URL.
# Dashboard -> New -> Blueprint -> pick this repo. You'll be asked for the `sync: false` values.
services:
  - type: web
    name: channellens-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Neon connection string (postgresql://...?sslmode=require)
      - key: YOUTUBE_API_KEY
        sync: false # leave empty and set DEMO_MODE=true to run on demo channels
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://channellens.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
