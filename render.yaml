# Render Blueprint: FastAPI service + managed Postgres.
# Dashboard -> New -> Blueprint -> pick this repo. You'll be asked for the two `sync: false` values.
services:
  - type: web
    name: channellens-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: channellens-db
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://channellens.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: channellens-db
    plan: free
